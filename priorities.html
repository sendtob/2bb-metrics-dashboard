<title>2BB Priorities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#FFFFFF;--ink:#231F20;--muted:#5F5B5C;--brand:#F1D93D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Public Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  min-height:96vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.wordmark{font-family:"Figtree";font-size:14px;font-weight:800;letter-spacing:.32em;text-transform:uppercase}
h1{font-family:"Figtree";font-weight:800;font-size:clamp(34px,7vw,52px);letter-spacing:-.015em;margin:14px 0 10px}
h1 .hl{background:linear-gradient(transparent 62%,var(--brand) 62%,var(--brand) 94%,transparent 94%);padding:0 .08em}
p{color:var(--muted);font-size:17px;max-width:34ch;margin:0 auto 30px}
a.go{display:inline-block;background:var(--ink);color:#fff;border-radius:14px;
  font-family:"Figtree";font-weight:800;font-size:19px;padding:16px 34px;text-decoration:none}
a.go:hover{background:#000}
</style>

  <div class="wordmark">Two Blind Brothers</div>
  <h1><span class="hl">Priorities</span> moved</h1>
