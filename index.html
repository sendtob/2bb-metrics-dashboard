<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Blind Brothers — Priorities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Two Blind Brothers brand: white ground, near-black ink, signature yellow. */
:root{
  --bg:#FFFFFF; --panel:#F7F7F7; --ink:#231F20; --muted:#5F5B5C;
  --line:#E3E1E1; --line-strong:#B9B6B7;
  --brand:#F1D93D;
  --low:#C24040; --high:#2E8B57;
  --mid:#C9862B;
  --shadow:0 1px 2px rgba(35,31,32,.06),0 8px 24px rgba(35,31,32,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Public Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;padding:0 20px 96px}
h1,h2,h3{font-family:"Figtree","Public Sans",Helvetica,Arial,sans-serif;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- landing ---------- */
.landing{min-height:92vh;display:flex;flex-direction:column;justify-content:center}
.wordmark{
  font-family:"Figtree";font-size:15px;font-weight:800;letter-spacing:.32em;
  text-transform:uppercase;text-align:center;color:var(--ink);
}
.landing h1{
  font-size:clamp(44px,9vw,64px);font-weight:800;letter-spacing:-.015em;line-height:1.05;
  text-align:center;margin:14px 0 6px;
}
.landing h1 .hl{
  background:linear-gradient(transparent 62%, var(--brand) 62%, var(--brand) 94%, transparent 94%);
  padding:0 .08em;
}
.landing .sub{text-align:center;color:var(--muted);margin:0 0 44px;font-size:17px}
.choice{
  display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;
  background:var(--bg);border:2px solid var(--ink);border-radius:14px;
  padding:26px 26px;margin-bottom:16px;box-shadow:var(--shadow);text-align:left;
  transition:background .12s ease, transform .12s ease;
}
.choice:hover{background:var(--brand);transform:translateY(-1px)}
.choice .t{font-family:"Figtree";font-weight:800;font-size:24px;letter-spacing:-.01em;display:block}
.choice .d{color:var(--muted);font-size:15px;margin-top:3px;display:block}
.choice:hover .d{color:var(--ink)}
.choice .arrow{font-size:24px;color:var(--ink);flex:none}
.landing .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}

/* ---------- shared screen chrome ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:26px 0 4px}
.back{font-weight:700;color:var(--ink);font-size:15px}
.back:hover{background:var(--brand);border-radius:6px}
.screen h2{font-size:clamp(30px,6vw,40px);font-weight:800;letter-spacing:-.015em;line-height:1.05;margin:6px 0 4px}
.screen .lede{color:var(--muted);margin:0 0 22px;font-size:16px}
.period{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.loading{color:var(--muted);text-align:center;padding:60px 0;font-size:16px}

.card{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card .name{font-family:"Figtree";font-weight:800;font-size:21px;letter-spacing:-.005em}
.card .crit{color:var(--muted);font-size:15px;margin:5px 0 16px;max-width:56ch}
.card .crit b{color:var(--ink);font-weight:600}

textarea,input[type=text]{
  width:100%;background:var(--panel);color:var(--ink);border:1.5px solid var(--line-strong);
  border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;resize:vertical;
}
textarea::placeholder,input::placeholder{color:var(--muted)}

/* ---------- six-month score (1&ndash;4) ---------- */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 14px}
.tick{
  border:1.5px solid var(--line-strong);border-radius:10px;padding:12px 8px;
  font-weight:600;font-size:14.5px;text-align:center;background:var(--bg);
}
.tick .num{display:block;font-family:"Figtree";font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;margin-bottom:2px}
.tick[aria-pressed="true"]{border-width:2px;color:#fff}
.tick[aria-pressed="true"].s1{background:var(--low);border-color:var(--low)}
.tick[aria-pressed="true"].s2{background:var(--muted);border-color:var(--muted)}
.tick[aria-pressed="true"].s3{background:var(--mid);border-color:var(--mid)}
.tick[aria-pressed="true"].s4{background:var(--high);border-color:var(--high)}
.total{
  background:var(--brand);border:1.5px solid var(--ink);border-radius:14px;
  padding:16px 20px;margin-bottom:22px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;
}
.total .lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.total .val{font-family:"Figtree";font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:var(--ink)}
.total .val small{font-size:16px;font-weight:600;color:var(--ink);opacity:.65}

/* ---------- weekly yes/no review ---------- */
.prow{display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--bg);border:1.5px solid var(--line);border-radius:14px;
  padding:18px 20px;margin-bottom:10px;box-shadow:var(--shadow)}
.prow .ptext{font-weight:600;font-size:16.5px;line-height:1.35}
.yn{display:flex;gap:8px;flex:none}
.ynb{border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 22px;
  font-weight:700;font-size:15px;background:var(--bg);min-width:64px}
.ynb[aria-pressed="true"].yes{background:var(--high);border-color:var(--high);color:#fff}
.ynb[aria-pressed="true"].no{background:var(--low);border-color:var(--low);color:#fff}
@media (max-width:560px){.prow{flex-direction:column;align-items:stretch}.yn .ynb{flex:1}}
.sech{font-family:"Figtree";font-weight:800;font-size:21px;letter-spacing:-.005em;margin:30px 0 4px}
.sechsub{color:var(--muted);font-size:15px;margin:0 0 14px}
.nextrow{display:flex;gap:8px;margin-bottom:8px}
.nextrow input{flex:1}
.rowdel{flex:none;color:var(--muted);font-size:20px;font-weight:600;padding:0 10px;border-radius:10px}
.rowdel:hover{color:var(--low)}
.addbtn{font-weight:700;color:var(--ink);font-size:15px;padding:8px 0}
.addbtn:hover{background:var(--brand);border-radius:6px}

/* ---------- save bar ---------- */
.savebar{position:sticky;bottom:0;padding:14px 0 20px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.save{
  width:100%;background:var(--ink);color:#FFFFFF;border-radius:14px;
  font-family:"Figtree";font-weight:800;font-size:19px;padding:17px;
  transition:transform .1s ease;
}
.save:hover{transform:translateY(-1px)}
.save:disabled{opacity:.5;cursor:default;transform:none}
.toast{text-align:center;font-size:14px;font-weight:600;color:var(--high);min-height:1.5em;margin-top:8px}
.toast.err{color:var(--low)}
.protonote{color:var(--muted);font-size:13px;text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ================= data ================= */
/* The six major goals, as the team's action statements. `k` is the storage key —
   renaming a goal is safe, changing its `k` orphans its history. */
const GOALS=[
 {k:"donors",   name:"Secure a Major Donor",            crit:"Secure <b>$100k+ donors</b>."},
 {k:"partners", name:"Secure a Major Partner",          crit:"Secure <b>Fortune 500 contractual relationships</b> or <b>$50k value</b>."},
 {k:"shopblind",name:"Achieve Shop Blind Progress",     crit:"<b>Self-funding</b>, with Impact on Spend <b>above 3.0</b>."},
 {k:"programs", name:"Achieve Other Program Progress",  crit:"<b>Major funding</b>, major program partners, and major impact."},
 {k:"opeff",    name:"Achieve Operational Efficiency",  crit:"<b>AI breakthroughs</b> or major expense reduction."},
 {k:"campaigns",name:"Launch New Campaigns",            crit:"<b>Novel, engaging, and creative</b> launches."},
];

/* Last week's priorities, seeded for the first review. From next week on,
   the list written in "Priorities for next week" is what gets reviewed. */
const SEED_PRIORITIES=[
 "Received and reviewed job applications",
 "Improved Shop Blind advertising efficiency",
 "Resolved documentation around Two Blind Brothers loans and grants",
 "Finished donor and partner pitch materials",
];

const SCORES=[
 {v:1,t:"Moved backwards"},
 {v:2,t:"No progress"},
 {v:3,t:"A little progress"},
 {v:4,t:"Significant progress"},
];

/* period + week labels */
function periodKey(){const d=new Date();return d.getFullYear()+"-H"+(d.getMonth()<6?1:2);}
function periodLabel(){const d=new Date(),y=d.getFullYear();return (d.getMonth()<6?"January to June ":"July to December ")+y;}
function weekEnding(){ // most recent Sunday
  const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d;
}
function weekKey(){const d=weekEnding();return d.toISOString().slice(0,10);}
function weekLabel(){return weekEnding().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function prevWeekKey(){const d=weekEnding(); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10);}

/* ================= storage =================
   Three transports, best available wins:
   1. "db"    — the claude.ai artifact copy of this page (shared artifact store).
   2. "sheet" — the team's Google Sheet, via the same Apps Script write endpoint
                and gviz read the old dashboard used. This is the live-site path.
   3. "local" — this device only, when neither of the above is reachable.

   Sheet mapping (Progress tab: week | pillar | state | note | priority | who | when,
   upserted on (week,pillar) by the deployed Apps Script — no server change needed):
     weekly:  week=<sunday>   pillar=wkmeta      note={"items":N,"next":M}
                              pillar=wk_<i>      state=big(yes)/none(no)  note=<priority text>
                              pillar=wknext_<i>  state=little             note=<next week's item>
     6-month: week=<H-end>    pillar=six_<goal>  state=regression/none/little/big (=1/2/3/4)
                              note=<the sentence, or "(no note)">                          */
const APPS_URL="https://script.google.com/macros/s/AKfycbxFYl7yMenuUkVCV9nSDSIvfP0-UnPN-R1NOYVrQM0kRzk8Z2WYtb9JTZBK-aQYwJGu3A/exec";
const SHEET_ID="1tvvGwAdkTx8Kzk91RMrUgGVV8fedHAmdgfy35rSpr6w";
const WHO="team";
const SCORE2ST={1:"regression",2:"none",3:"little",4:"big"};
const ST2SCORE={regression:1,none:2,little:3,big:4};
function sixSheetKey(){const d=new Date();return d.getFullYear()+(d.getMonth()<6?"-06-30":"-12-31");}

/* gviz JSONP read (fetch can't read the cross-origin gviz body; a script tag can,
   and it survives the multi-account redirect that kills script-tag WRITES) */
function gviz(tq){
  return new Promise((res,rej)=>{
    const cb="gv_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const cleanup=()=>{try{delete window[cb]}catch(e){} s.remove();};
    window[cb]=o=>{cleanup(); (!o||o.status==="error")?rej(new Error("gviz error")):res(o.table||{cols:[],rows:[]});};
    s.onerror=()=>{cleanup();rej(new Error("gviz load failed"));};
    s.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json;responseHandler:"+cb+
          "&sheet=Progress&tq="+encodeURIComponent(tq);
    setTimeout(()=>{if(window[cb]){cleanup();rej(new Error("gviz timeout"));}},8000);
    document.head.appendChild(s);
  });
}
function tableRows(table){
  const at=lbl=>{const i=(table.cols||[]).findIndex(c=>String(c.label||c.id).trim().toLowerCase()===lbl);return i;};
  const iW=at("week"),iP=at("pillar"),iS=at("state"),iN=at("note");
  return (table.rows||[]).map(r=>{
    const c=r.c||[]; const v=i=>i>=0&&c[i]&&c[i].v!=null?String(c[i].v):"";
    return {week:v(iW),pillar:v(iP),state:v(iS),note:v(iN)};
  });
}

/* Apps Script write — fetch first (survives multi-account redirect), JSONP fallback */
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const cleanup=()=>{try{delete window[cb]}catch(e){} s.remove();};
    window[cb]=j=>{cleanup();res(j);};
    s.onerror=()=>{cleanup();rej(new Error("jsonp failed"));};
    s.src=url+"&callback="+cb;
    setTimeout(()=>{if(window[cb]){cleanup();rej(new Error("jsonp timeout"));}},30000);
    document.head.appendChild(s);
  });
}
function callApi(qs){
  const url=APPS_URL+"?"+qs;
  return fetch(url,{method:"GET",redirect:"follow",credentials:"omit"})
    .then(r=>{ if(!r.ok) throw new Error("http "+r.status); return r.text(); })
    .then(t=>{
      const m=/^[^(]*\(([\s\S]*)\)\s*;?\s*$/.exec(String(t).trim());
      const j=JSON.parse(m?m[1]:t);
      if(!j||typeof j!=="object") throw new Error("bad response");
      return j;
    })
    .catch(()=>jsonp(url));
}
async function writeRow(week,pillar,state,note){
  const j=await callApi("fn=progress&week="+encodeURIComponent(week)+
    "&pillar="+encodeURIComponent(pillar)+"&state="+encodeURIComponent(state)+
    "&note="+encodeURIComponent(note)+"&priority=&who="+encodeURIComponent(WHO)+"&pass=");
  if(!j.ok) throw new Error(j.error||"write refused");
}

/* transport resolution, once per load */
const MODE_READY=(async()=>{
  try{
    if(typeof claude!=="undefined"&&claude&&claude.use){
      const dbh=await claude.use("db");
      if(dbh) return {mode:"db",db:dbh};
    }
  }catch(e){}
  try{ await gviz("select A limit 1"); return {mode:"sheet"}; }catch(e){}
  return {mode:"local"};
})();

function lsGet(k){try{return JSON.parse(localStorage.getItem("p2."+k))||null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("p2."+k,JSON.stringify(v))}catch(e){}}

async function fetchWeek(weekIso){
  const M=await MODE_READY;
  if(M.mode==="db"){
    try{const s=await M.db.doc("weeks/"+weekIso).get(); return s.exists?s.data():null}catch(e){return null}
  }
  if(M.mode==="sheet"){
    try{
      const rows=tableRows(await gviz("select * where A='"+weekIso+"'"));
      if(!rows.length) return null;
      const metaRow=rows.find(r=>r.pillar==="wkmeta");
      let counts=null; try{counts=metaRow?JSON.parse(metaRow.note):null}catch(e){}
      const review={}, list=[], next=[];
      rows.forEach(r=>{
        let m;
        if((m=/^wk_(\d+)$/.exec(r.pillar))){
          const i=+m[1];
          if(!counts||i<counts.items){ review[r.note]=(r.state==="big"); list[i]=r.note; }
        }else if((m=/^wknext_(\d+)$/.exec(r.pillar))){
          const i=+m[1];
          if(!counts||i<counts.next) next[i]=r.note;
        }
      });
      if(!metaRow&&!list.length&&!next.filter(Boolean).length) return null;
      return {review:review, next:next.filter(Boolean), reviewedList:list.filter(Boolean)};
    }catch(e){return null}
  }
  return lsGet("weeks/"+weekIso);
}
async function saveWeek(weekIso,clean){
  const M=await MODE_READY;
  if(M.mode==="db"){ await M.db.doc("weeks/"+weekIso).set(clean); return; }
  if(M.mode==="sheet"){
    await writeRow(weekIso,"wkmeta","little",
      JSON.stringify({items:clean.reviewedList.length,next:clean.next.length}));
    for(let i=0;i<clean.reviewedList.length;i++){
      const t=clean.reviewedList[i];
      if(typeof clean.review[t]==="boolean")
        await writeRow(weekIso,"wk_"+i,clean.review[t]?"big":"none",t.slice(0,400));
    }
    for(let i=0;i<clean.next.length;i++)
      await writeRow(weekIso,"wknext_"+i,"little",clean.next[i].slice(0,400));
    return;
  }
  lsSet("weeks/"+weekIso,clean);
}
async function fetchSix(){
  const M=await MODE_READY;
  if(M.mode==="db"){
    try{const s=await M.db.doc("six/"+periodKey()).get(); return s.exists?s.data():null}catch(e){return null}
  }
  if(M.mode==="sheet"){
    try{
      const rows=tableRows(await gviz("select * where A='"+sixSheetKey()+"'"));
      const scores={},notes={};
      rows.forEach(r=>{
        const m=/^six_(.+)$/.exec(r.pillar);
        if(m&&ST2SCORE[r.state]){ scores[m[1]]=ST2SCORE[r.state]; if(r.note&&r.note!=="(no note)") notes[m[1]]=r.note; }
      });
      return Object.keys(scores).length?{scores:scores,notes:notes}:null;
    }catch(e){return null}
  }
  return lsGet("six/"+periodKey());
}
async function saveSix(draft){
  const M=await MODE_READY;
  if(M.mode==="db"){ await M.db.doc("six/"+periodKey()).set(draft); return; }
  if(M.mode==="sheet"){
    for(const g of GOALS){
      const s=draft.scores[g.k];
      if(Number.isInteger(s))
        await writeRow(sixSheetKey(),"six_"+g.k,SCORE2ST[s],
          (draft.notes[g.k]||"").trim().slice(0,400)||"(no note)");
    }
    return;
  }
  lsSet("six/"+periodKey(),draft);
}
async function storageNote(){
  const M=await MODE_READY;
  return M.mode==="local"
    ?"Offline: saves stay on this device."
    :"Saves are shared with the whole team.";
}

/* in-memory drafts, so re-renders never lose unsaved edits */
let WEEK_DRAFT=null, WEEK_ITEMS=null, SIX_DRAFT=null;

/* ================= rendering ================= */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let VIEW="";
function go(v){VIEW=v;route();}
function route(){
  if(VIEW==="weekly") renderWeekly();
  else if(VIEW==="sixmonth") renderSix();
  else renderLanding();
  window.scrollTo(0,0);
}
/* CSP-safe navigation: no inline onclick attributes */
app.addEventListener("click",e=>{
  const nav=e.target.closest("[data-go]");
  if(nav) go(nav.dataset.go);
});
function loadingScreen(label){
  app.innerHTML=`<div class="screen"><div class="top"><button class="back" data-go="">&larr; Back</button></div><div class="loading">${label}</div></div>`;
}

/* ---------- landing ---------- */
function renderLanding(){
  app.innerHTML=`
  <div class="landing">
    <div class="wordmark">Two Blind Brothers</div>
    <h1><span class="hl">Priorities</span></h1>
    <p class="sub">One page. Say how it's going.</p>
    <button class="choice" data-go="weekly">
      <span><span class="t">Weekly priorities</span>
      <span class="d">Yes or no on each of last week's priorities, then write next week's.</span></span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </button>
    <button class="choice" data-go="sixmonth">
      <span><span class="t">Six-month priorities</span>
      <span class="d">Score the six goals, 1 to 4. Push the total up.</span></span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </button>
    <div class="foot" id="modeNote"></div>
  </div>`;
  storageNote().then(t=>{const n=document.getElementById("modeNote"); if(n) n.textContent=t;});
}

/* ---------- six-month ---------- */
function totalOf(scores){return GOALS.reduce((n,g)=>n+(scores[g.k]||0),0);}

async function renderSix(){
  if(!SIX_DRAFT){
    loadingScreen("Loading the team's scores&hellip;");
    const saved=await fetchSix();
    if(VIEW!=="sixmonth") return; // navigated away while loading
    SIX_DRAFT=Object.assign({scores:{},notes:{}},saved||{});
    SIX_DRAFT.scores=SIX_DRAFT.scores||{}; SIX_DRAFT.notes=SIX_DRAFT.notes||{};
  }
  const draft=SIX_DRAFT;

  app.innerHTML=`
  <div class="screen">
    <div class="top"><button class="back" data-go="">&larr; Back</button><span class="period">${periodLabel()}</span></div>
    <h2>Six-month priorities</h2>
    <p class="lede">The team's honest read on each goal, scored against its bar. The aim is simple: get the total as high as it can honestly go.</p>
    <div class="total"><span class="lbl">Cumulative score</span><span class="val" id="totalVal">${totalOf(draft.scores)}<small> / ${GOALS.length*4}</small></span></div>
    ${GOALS.map(g=>{
      const s=draft.scores[g.k];
      return `<section class="card" data-goal="${g.k}">
        <div><span class="name">${g.name}</span></div>
        <p class="crit">The bar: ${g.crit}</p>
        <div class="rail" role="group" aria-label="Score for ${g.name}, 1 to 4">
          ${SCORES.map(x=>`<button class="tick s${x.v}" aria-pressed="${s===x.v}" data-score="${x.v}" aria-label="${x.v}, ${x.t}"><span class="num" aria-hidden="true">${x.v}</span>${x.t}</button>`).join("")}
        </div>
        <textarea rows="2" data-note="${g.k}" placeholder="Why that score, in one sentence (optional)">${esc(draft.notes[g.k]||"")}</textarea>
      </section>`;
    }).join("")}
    <div class="savebar">
      <button class="save" id="saveBtn">Save six-month scores</button>
      <div class="toast" id="toast" role="status"></div>
      <div class="protonote" id="noteLine"></div>
    </div>
  </div>`;
  storageNote().then(t=>{const n=document.getElementById("noteLine"); if(n) n.textContent=t;});

  app.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{
    const goal=b.closest("[data-goal]").dataset.goal;
    draft.scores[goal]=+b.dataset.score;
    b.closest(".rail").querySelectorAll(".tick").forEach(t=>t.setAttribute("aria-pressed",String(+t.dataset.score===draft.scores[goal])));
    document.getElementById("totalVal").innerHTML=`${totalOf(draft.scores)}<small> / ${GOALS.length*4}</small>`;
  });
  app.querySelectorAll("[data-note]").forEach(t=>t.oninput=()=>{draft.notes[t.dataset.note]=t.value;});
  document.getElementById("saveBtn").onclick=async()=>{
    const btn=document.getElementById("saveBtn"), toast=document.getElementById("toast");
    btn.disabled=true; toast.classList.remove("err"); toast.textContent="Saving…";
    draft.when=new Date().toISOString();
    try{
      await saveSix(draft);
      const n=Object.keys(draft.scores).length;
      toast.textContent=n===GOALS.length?"Saved. All six goals scored.":`Saved. ${GOALS.length-n} of ${GOALS.length} still unscored.`;
    }catch(e){
      toast.classList.add("err"); toast.textContent="Not saved. Check your connection and press Save again.";
    }
    btn.disabled=false;
  };
}

/* ---------- weekly ---------- */
async function renderWeekly(){
  if(!WEEK_DRAFT){
    loadingScreen("Loading last week's priorities&hellip;");
    const [saved,prev]=await Promise.all([fetchWeek(weekKey()),fetchWeek(prevWeekKey())]);
    if(VIEW!=="weekly") return; // navigated away while loading
    WEEK_DRAFT=Object.assign({review:{},next:["",""]},saved||{});
    WEEK_DRAFT.review=WEEK_DRAFT.review||{};
    if(!Array.isArray(WEEK_DRAFT.next)||!WEEK_DRAFT.next.length) WEEK_DRAFT.next=["",""];
    const list=((prev&&prev.next)||[]).map(s=>String(s).trim()).filter(Boolean);
    WEEK_ITEMS=list.length?list:SEED_PRIORITIES;
  }
  const draft=WEEK_DRAFT, items=WEEK_ITEMS;

  app.innerHTML=`
  <div class="screen">
    <div class="top"><button class="back" data-go="">&larr; Back</button><span class="period">Week ending ${weekLabel()}</span></div>
    <h2>Weekly priorities</h2>
    <p class="lede">Last week the team named these priorities. Yes or no: did each one get done?</p>
    ${items.map((t,i)=>`
      <div class="prow" data-item="${i}">
        <span class="ptext">${esc(t)}</span>
        <span class="yn" role="group" aria-label="Did we: ${esc(t)}">
          <button class="ynb yes" aria-pressed="${draft.review[t]===true}" data-ans="yes">Yes</button>
          <button class="ynb no" aria-pressed="${draft.review[t]===false}" data-ans="no">No</button>
        </span>
      </div>`).join("")}
    <h3 class="sech">Priorities for next week</h3>
    <p class="sechsub">Write the list now; next week's review is a yes or no on each line.</p>
    <div id="nextList">
      ${draft.next.map((v,i)=>`
        <div class="nextrow">
          <input type="text" data-next="${i}" placeholder="Something we will have done" value="${esc(v)}">
          <button class="rowdel" data-del="${i}" aria-label="Remove this line">&times;</button>
        </div>`).join("")}
    </div>
    <button class="addbtn" id="addNext">+ Add another</button>
    <div class="savebar">
      <button class="save" id="saveBtn">Save the week</button>
      <div class="toast" id="toast" role="status"></div>
      <div class="protonote" id="noteLine"></div>
    </div>
  </div>`;
  storageNote().then(t=>{const n=document.getElementById("noteLine"); if(n) n.textContent=t;});

  app.querySelectorAll(".ynb").forEach(b=>b.onclick=()=>{
    const t=items[+b.closest("[data-item]").dataset.item];
    draft.review[t]=(b.dataset.ans==="yes");
    const row=b.closest(".yn");
    row.querySelector(".yes").setAttribute("aria-pressed",String(draft.review[t]===true));
    row.querySelector(".no").setAttribute("aria-pressed",String(draft.review[t]===false));
  });
  const syncNext=()=>{app.querySelectorAll("[data-next]").forEach(inp=>{draft.next[+inp.dataset.next]=inp.value;});};
  app.querySelectorAll("[data-next]").forEach(inp=>inp.oninput=syncNext);
  /* add/remove re-render; drafts live in memory, so nothing unsaved is lost */
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    syncNext(); draft.next.splice(+b.dataset.del,1);
    if(!draft.next.length) draft.next=[""];
    renderWeekly();
  });
  document.getElementById("addNext").onclick=()=>{syncNext(); draft.next.push(""); renderWeekly();};
  document.getElementById("saveBtn").onclick=async()=>{
    const btn=document.getElementById("saveBtn"), toast=document.getElementById("toast");
    syncNext();
    btn.disabled=true; toast.classList.remove("err"); toast.textContent="Saving…";
    const clean={
      review:draft.review,
      reviewedList:items,
      next:draft.next.map(s=>s.trim()).filter(Boolean),
      when:new Date().toISOString(),
    };
    try{
      await saveWeek(weekKey(),clean);
      const unanswered=items.filter(t=>typeof draft.review[t]!=="boolean").length;
      const parts=[unanswered?`Saved. ${unanswered} still unanswered.`:"Saved."];
      if(!clean.next.length) parts.push("No priorities written for next week yet.");
      toast.textContent=parts.join(" ");
    }catch(e){
      toast.classList.add("err"); toast.textContent="Not saved fully. Check your connection and press Save again.";
    }
    btn.disabled=false;
  };
}

route();
</script>
